site_name: "Розробка проєктів засобами платформи .NET"
site_description: "Документація до дисципліни Розробка проєктів засобами платформи .NET"
repo_url: https://github.com/mypo-vntu/vntu-dotnet-pract
repo_name: mypo-vntu/vntu-dotnet-pract

docs_dir: site-docs
site_dir: site

theme:
  name: material
  language: uk
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Темна тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Світла тема
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.integrate
    - search.suggest

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.magiclink
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Головна: index.md
  - Налаштування середовища: 00-setup.md
  - Практичні роботи:
      - practs.md
      - "ПР1. C# основи": practs/01-csharp-basics.md
      - "ПР2. ООП та виключення": practs/02-oop-exceptions.md
      - "ПР3. Генерики, делегати, події": practs/03-generics-delegates-events.md
      - "ПР4. LINQ to Objects": practs/04-linq-to-objects.md
      - "ПР5. ASP.NET Core + EF Core + SQLite": practs/05-aspnetcore-efcore-sqlite-crud.md
      - "ПР6. REST API": practs/06-rest-api.md
      - "ПР7. Автентифікація та авторизація (JWT)": practs/07-auth-jwt.md
      - "ПР8. Архітектура та тестування": practs/08-architecture-testing.md
  - Лекції: lectures.md
