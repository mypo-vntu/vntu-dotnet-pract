name: docs

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install -r requirements.txt

      - run: zensical build --clean

      - name: Pack data kits
        run: |
          mkdir -p site/kits
          cd kits
          for k in */; do
            k="${k%/}"
            zip -qr "../site/kits/$k.zip" "$k" -x "$k/build-db.cs" "*/bin/*" "*/obj/*"
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment
